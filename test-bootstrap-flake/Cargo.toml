[package]
name = "test-bootstrap"
version = "0.0.0"
edition = "2021"

default-run = "test-bootstrap"

[features]
cargo_submodule_tool_lib_enabled = ["dep:cargo-submodule-tool-lib"]
syn_enabled = ["dep:syn"]
toml_edit_enabled = ["dep:toml_edit"]
clap_enabled = ["dep:clap"]
cargo_repo_sync_lib_enabled = ["dep:cargo-repo-sync-lib"]
git2_enabled = ["dep:git2"]
hex_enabled = ["dep:hex"]
cargo_metadata_enabled = ["dep:cargo_metadata"]
sha1_enabled = ["dep:sha1"]
anyhow_enabled = ["dep:anyhow"]
pathdiff_enabled = ["dep:pathdiff"]
serde_enabled = ["dep:serde"]
serde_json_enabled = ["dep:serde_json"]
walkdir_enabled = ["dep:walkdir"]
git_wrapper_lib_enabled = ["dep:git-wrapper-lib"]
build-metrics = []
bootstrap-self-test = [] # enabled in the bootstrap unit tests



#[[bin]]
#name = "test-bootstrap"
#path = "src/bin/main.rs"
#test = false

#[[bin]]
#name = "test-rustc"
#path = "src/bin/rustc.rs"
#test = false

#[[bin]]
#name = "test-rustdoc"
#path = "src/bin/rustdoc.rs"
#test = false

#[[bin]]
#name = "test-sccache-plus-cl"
#path = "src/bin/sccache-plus-cl.rs"
#test = false

#[[bin]]
#name = "test-nix_bootstrap"
#path = "src/bin/nix_bootstrap.rs"
#test = false

[dependencies]
cargo-submodule-tool-lib = { workspace = true, optional = true }
syn = { version = "*", optional = true }
toml_edit = { version = "*", optional = true }
clap = { version = "*", optional = true }
cargo-repo-sync-lib = { workspace = true, optional = true }
git2 = { version = "*", optional = true }
hex = { version = "*", optional = true }
cargo_metadata = { workspace = true, optional = true }
sha1 = { version = "*", optional = true }
anyhow = { version = "*", optional = true }
pathdiff = { version = "*", optional = true }
serde = { version = "*", optional = true }
serde_json = { version = "*", optional = true }
walkdir = { version = "*", optional = true }
git-wrapper-lib = { workspace = true, optional = true }
#test_definitions_macro = { path = "../../../test_definitions_crates/test_definitions_macro" }

[target.'cfg(windows)'.dependencies.junction]
version = "1.0.0"

[target.'cfg(windows)'.dependencies.windows]
version = "0.52"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_JobObjects",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_Time",
]

[dev-dependencies]

# We care a lot about bootstrap's compile times, so don't include debuginfo for
# dependencies, only bootstrap itself.
[profile.dev]
debug = 0

[profile.dev.package]
# Only use debuginfo=1 to further reduce compile times.
bootstrap.debug = 1
