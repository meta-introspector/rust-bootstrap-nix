[package]
name = "bootstrap-config-builder"
version = "0.1.0"
edition = "2021"

[dependencies]
cargo-submodule-tool-lib = { workspace = true, optional = true }
syn = { version = "*", optional = true }
toml_edit = { version = "*", optional = true }
cargo-repo-sync-lib = { workspace = true, optional = true }
hex = { version = "*", optional = true }
cargo_metadata = { workspace = true, optional = true }
sha1 = { version = "*", optional = true }
pathdiff = { version = "*", optional = true }
walkdir = { version = "*", optional = true }
git-wrapper-lib = { workspace = true, optional = true }
clap = { version = "4.5.4", features = ["derive"] }
anyhow = "1.0.86"
serde_json = "1.0.117"
toml = "0.8.12"
serde = { version = "1.0.198", features = ["derive"] }
log = "0.4.21"
env_logger = "0.11.3"
git2 = "0.18.3"

[dev-dependencies]
tempfile = "3.10.1"

[lib]
path = "src/lib.rs"

[[bin]]
name = "nix-dir"
path = "src/bin/nix-dir.rs"

[[bin]]
name = "bootstrap-config-generator"
path = "src/bin/bootstrap-config-generator.rs"

[[bin]]
name = "flake-step-manager"
path = "src/bin/flake-step-manager.rs"

[features]
cargo_submodule_tool_lib_enabled = ["dep:cargo-submodule-tool-lib"]
syn_enabled = ["dep:syn"]
toml_edit_enabled = ["dep:toml_edit"]
clap_enabled = ["dep:clap"]
cargo_repo_sync_lib_enabled = ["dep:cargo-repo-sync-lib"]
git2_enabled = ["dep:git2"]
hex_enabled = ["dep:hex"]
cargo_metadata_enabled = ["dep:cargo_metadata"]
sha1_enabled = ["dep:sha1"]
anyhow_enabled = ["dep:anyhow"]
pathdiff_enabled = ["dep:pathdiff"]
serde_enabled = ["dep:serde"]
serde_json_enabled = ["dep:serde_json"]
walkdir_enabled = ["dep:walkdir"]
git_wrapper_lib_enabled = ["dep:git-wrapper-lib"]

